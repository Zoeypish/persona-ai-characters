<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona</title>
<meta name="description" content="A home for AI characters and the human creators who build them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="nav"></header>

<main id="main"></main>

<footer>
  <span>© Persona 2026 · <a href="brand.html">Brand</a> · <a href="studio.html">Creator Studio</a></span>
  <span>Characters and images © their creators, shown with credit for demonstration.</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="api/config"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script>
  var slug = new URLSearchParams(location.search).get("c");
  var c = null, pins = [], tab = "pins";
  function fact(k, v) { return '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>'; }
  function render() {
    if (!c) {
      document.getElementById("main").innerHTML = '<section class="phead"><h1>Not found</h1><p class="ptag">There is no character at this address.</p>' +
        '<p class="center"><a class="pill dark" href="./">Explore characters</a></p></section>';
      return;
    }
    document.title = c.name + " · Persona";
    var creatorHtml = c.creatorUsername ? '<a href="creator.html" class="ulink">' + esc(c.creator) + '</a>' : esc(c.creator);
    var body = tab === "pins"
      ? (pins.length ? '<div class="pins">' + pins.map(pinHtml).join("") + '</div>' : '<p class="empty-pins">No images live yet. The creator picks what goes live in the Studio.</p>')
      : '<div class="about">' +
          '<dl class="facts">' + fact("Handle", esc(c.handle)) + fact("Based in", esc(c.origin)) + fact("Created by", creatorHtml) +
            fact("Since", esc(c.since)) + fact("Audience", esc(c.audience)) + fact("Category", esc(c.category)) + '</dl>' +
          '<div class="bio">' + c.bio.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join("") + '</div>' +
          '<ul class="known">' + c.knownFor.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join("") + '</ul>' +
          (c.link && /^http/.test(c.link) ? '<p class="note"><a class="ulink" href="' + c.link + '" target="_blank" rel="noopener">' + esc(c.handle) + ' on Instagram</a></p>' : '') +
        '</div>';
    document.getElementById("main").innerHTML =
      '<section class="phead">' +
        '<span class="big-ava" data-ava="' + c.slug + '"></span>' +
        '<h1>' + esc(c.name) + '</h1>' +
        '<p class="phandle">' + esc(c.handle) + '</p>' +
        '<p class="ptag">' + esc(c.tagline) + '</p>' +
        '<p class="pby">Created by ' + creatorHtml + ' · ' + esc(c.origin) + '</p>' +
        '<div class="pactions">' + followBtn(c.slug, "lg") + '</div>' +
        '<div class="ptabs"><button data-tab="pins" class="' + (tab === "pins" ? "on" : "") + '">Pins</button><button data-tab="about" class="' + (tab === "about" ? "on" : "") + '">About</button></div>' +
      '</section>' +
      '<section class="feed">' + body + '</section>';
    fillAvatars(document.getElementById("main"));
    document.querySelectorAll("[data-tab]").forEach(function (b) { b.onclick = function () { tab = b.dataset.tab; render(); }; });
  }
  loadAllLive().then(function (d) {
    c = slug ? charBySlug(slug) : CHARACTERS[0];
    if (c) pins = d[c.slug] || [];
    render();
  });
</script>
</body>
</html>
