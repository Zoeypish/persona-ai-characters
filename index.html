<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona — AI characters & brands</title>
<meta name="description" content="A home for AI characters and the human creators who build them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="nav"></header>

<main class="feed">
  <div class="chips" id="chips"></div>
  <div class="pins" id="pins"></div>
</main>

<footer>
  <span>© Persona 2026 · <a href="brand.html">Brand</a> · <a href="studio.html">Studio</a> · <a href="content-policy.html">Content Policy</a> · <a href="terms.html">Terms</a></span>
  <span>Images © their creators.</span>
</footer>

<script src="vendor/supabase-js-2.119.0.js"></script>
<script src="config.js"></script>
<script src="api/config"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script src="feed.js"></script>
<script src="search.js"></script>
<script>
  var DATA = {}, filter = new URLSearchParams(location.search).get("c") || "all";
  function chips() {
    var list = [{ slug: "all", name: "All" }, { slug: "following", name: "Following" }].concat(CHARACTERS.filter(function (c) { return (DATA[c.slug] || []).length; }));
    document.getElementById("chips").innerHTML = list.map(function (c) {
      return '<button class="chip' + (filter === c.slug ? " on" : "") + '" data-chip="' + c.slug + '">' +
        (c.slug !== "all" && c.slug !== "following" ? '<span class="mini-ava" data-ava="' + c.slug + '"></span>' : '') + esc(c.name) + '</button>';
    }).join("");
    fillAvatars(document.getElementById("chips"));
  }
  function render() {
    var pins = [], f = Social.following();
    if (filter === "all") {
      // Personal mix: 50% characters you follow, 35% similar styles, 15% random; fresh pins first.
      pins = Feed.build(DATA, f, Social.saved());
    } else {
      var slugs = filter === "following" ? f : [filter];
      slugs.forEach(function (s) { pins = pins.concat(DATA[s] || []); });
    }
    var el = document.getElementById("pins");
    if (!pins.length) {
      el.innerHTML = '<p class="empty-pins">' + (filter === "following" ? 'Follow a character to see their pins here.' : 'Nothing live yet.') + '</p>';
      el.classList.remove("pins-cols");
    } else layoutPins(el, pins, { ordered: filter === "all" });
    fillAvatars(el); chips();
  }
  document.getElementById("chips").onclick = function (e) {
    var b = e.target.closest("[data-chip]"); if (!b) return;
    filter = b.dataset.chip; history.replaceState(null, "", filter === "all" ? "./" : "?c=" + filter); render();
  };
  document.addEventListener("persona:follow", function () { if (filter === "following") render(); });
  loadAllLive().then(function (d) { DATA = d; render(); });
</script>
</body>
</html>
