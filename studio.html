<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio — Persona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="nav"></header>

<main class="studio" id="studio" hidden>
  <div class="studio-top">
    <div>
      <div class="eyebrow" id="who"></div>
      <h1>Studio</h1>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn" href="generate.html">Generate with AI</a>
      <a class="btn ghost" href="tips.html">Tips</a>
      <a class="btn ghost" id="view" href="#">View public profile</a>
      <button class="btn ghost" id="out">Sign out</button>
    </div>
  </div>

  <div class="allowance" id="allowance"></div>

  <div class="tabs" id="tabs"></div>

  <form class="newchar" id="newchar" hidden autocomplete="off">
    <h2 id="newchar-title">New character</h2>
    <div class="newchar-body">
      <label class="newchar-ava" id="ava-pick" title="Choose a profile photo">
        <input type="file" id="ava-file" accept="image/*" hidden>
        <span class="newchar-ava-img" id="ava-img"><span>+ Photo</span></span>
      </label>
      <div class="newchar-fields">
        <input class="newchar-name" name="name" required maxlength="60" placeholder="Character name" aria-label="Character name">
        <input name="handle" maxlength="40" placeholder="@handle" aria-label="Handle">
        <textarea name="bio" rows="3" maxlength="600" placeholder="Short bio (optional)" aria-label="Short bio"></textarea>
      </div>
    </div>
    <label class="drop newchar-drop" id="first-drop">
      <input type="file" id="first-file" accept="image/*" multiple hidden>
      <strong>First images</strong>
      <span id="first-sub">Optional. These go live on the homepage right away.</span>
    </label>
    <div class="newchar-thumbs" id="first-thumbs"></div>
    <div class="newchar-row">
      <button class="btn" type="submit" id="newchar-go">Create character</button>
      <button class="btn ghost" type="button" id="newchar-cancel">Cancel</button>
      <span class="err" id="newchar-err" role="alert"></span>
    </div>
  </form>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" multiple hidden>
    <strong>Upload images</strong>
    <span id="drop-sub">Drop files here or click to choose. New uploads stay hidden until you switch them live.</span>
  </label>

  <div class="studio-bar"><span id="count"></span><span>Switch on to publish</span></div>
  <div class="sgrid" id="grid"></div>
  <p class="note" id="mode"></p>
</main>
<footer>
  <span>© Persona 2026 · <a href="brand.html">Brand</a> · <a href="studio.html">Studio</a> · <a href="tips.html">Tips</a></span>
  <span>Images © their creators.</span>
</footer>
<script src="vendor/supabase-js-2.119.0.js"></script>
<script src="config.js"></script>
<script src="api/config"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script>
  var current = null, user = null, mine = [];
  function bySlug(s) { return CHARACTERS.filter(function (c) { return c.slug === s; })[0]; }

  var MAIN = ["allowance", "drop", "grid"];
  function showMain(on) {
    MAIN.forEach(function (id) { document.getElementById(id).hidden = !on; });
    document.querySelector(".studio-bar").hidden = !on;
    document.getElementById("view").hidden = !on;
  }

  Promise.all([Studio.session(), Studio.ready]).then(function (r) {
    var s = r[0];
    if (!s) { location.href = "login.html"; return; }
    user = s;
    document.getElementById("studio").hidden = false;
    document.getElementById("who").textContent = "Signed in as " + (s.name || s.email);
    if (Studio.mode === "demo") document.getElementById("mode").textContent =
      "Demo mode: uploads and choices are saved in this browser only. Connect Supabase to save them for everyone.";
    return Studio.myCharacters().then(function (list) {
      mine = list.filter(bySlug);
      if (!mine.length) { renderTabs(); openCreate(true); return; }
      current = mine[0]; renderTabs(); load();
    });
  });

  document.getElementById("out").onclick = function () { Studio.signOut().then(function () { location.href = "./"; }); };

  function renderTabs() {
    // Only the characters this account owns.
    var creating = !document.getElementById("newchar").hidden;
    document.getElementById("tabs").innerHTML = mine.map(function (s) {
      var c = bySlug(s);
      return '<button data-s="' + s + '" class="' + (s === current && !creating ? "on" : "") + '">' + esc(c.name) + '</button>';
    }).join("") + '<button data-new class="tab-new' + (creating ? " on" : "") + '">+ New character</button>';
    document.querySelectorAll("#tabs button[data-s]").forEach(function (b) {
      b.onclick = function () { current = b.dataset.s; closeCreate(); renderTabs(); load(); };
    });
    document.querySelector("#tabs [data-new]").onclick = function () { openCreate(false); };
  }

  function renderAllowance(q) {
    var pct = Math.min(100, (q.points % Studio.POINTS_PER_UPLOAD) / Studio.POINTS_PER_UPLOAD * 100);
    document.getElementById("allowance").innerHTML =
      '<div><dt>Uploads</dt><dd>' + q.used + ' of ' + q.limit + ' used</dd></div>' +
      '<div><dt>Points</dt><dd>' + q.points + '</dd></div>' +
      '<div class="grow"><dt>Next upload unlocks in ' + q.toNext + ' points</dt><div class="meter"><span style="width:' + pct + '%"></span></div></div>' +
      (Studio.mode === "demo" ? '<div><button class="linkbtn" id="pts">+10 points (demo)</button></div>' : '');
    var b = document.getElementById("pts"); if (b) b.onclick = function () { Studio.addDemoPoints(10); refreshQuota(); };
    var full = q.left <= 0;
    document.getElementById("drop").classList.toggle("locked", full);
    document.getElementById("file").disabled = full;
    document.getElementById("drop-sub").textContent = full
      ? "You've used all " + q.limit + " uploads. Every " + Studio.POINTS_PER_UPLOAD + " points unlocks one more."
      : q.left + " upload" + (q.left === 1 ? "" : "s") + " left. Drop files here or click to choose. New uploads stay hidden until you switch them live.";
    return q;
  }
  function refreshQuota() { return Studio.quota().then(renderAllowance); }

  function load() {
    var c = bySlug(current);
    document.getElementById("view").href = "profile.html?c=" + c.slug;
    refreshQuota();
    Studio.all(c).then(function (list) {
      var liveN = list.filter(function (i) { return i.live; }).length;
      document.getElementById("count").textContent = liveN + " of " + list.length + " live";
      var grid = document.getElementById("grid");
      if (!list.length) { grid.innerHTML = '<p class="empty" style="grid-column:1/-1">No images yet. Upload the first ones above.</p>'; return; }
      grid.innerHTML = list.map(function (im, i) {
        return '<div class="sitem' + (im.live ? "" : " off") + '"><div class="tile">' + tileImg(im, c.name) + '</div>' +
          '<div class="sitem-row"><label class="toggle"><input type="checkbox" data-i="' + i + '"' + (im.live ? " checked" : "") + '> ' + (im.live ? "Live" : "Hidden") + '</label>' +
          (im.uploaded ? '<button class="linkbtn" data-del="' + i + '">Delete</button>' : '<span class="badge">Featured</span>') + '</div></div>';
      }).join("");
      grid.querySelectorAll("input[type=checkbox]").forEach(function (cb) {
        cb.onchange = function () { Promise.resolve(Studio.setLive(c, list[+cb.dataset.i].id, cb.checked)).then(load); };
      });
      grid.querySelectorAll("[data-del]").forEach(function (b) {
        b.onclick = function () { Studio.remove(c, list[+b.dataset.del]).then(load); };
      });
    });
  }

  function handle(fileList) {
    var files = Array.prototype.slice.call(fileList);
    Studio.quota().then(function (q) {
      var take = files.slice(0, q.left);
      if (!take.length) return;
      return Studio.upload(bySlug(current), take);
    }).then(load).catch(function (e) { document.getElementById("mode").textContent = "Upload failed: " + e.message; });
  }
  // ---------- Create a character ----------
  var form = document.getElementById("newchar"), avaFile = null, firstFiles = [], firstLeft = 0;
  function openCreate(first) {
    form.hidden = false; showMain(false);
    document.getElementById("newchar-title").textContent = first ? "Create your character" : "New character";
    document.getElementById("newchar-cancel").hidden = first;
    renderTabs();
    Studio.quota().then(function (q) {
      firstLeft = q.left;
      document.getElementById("first-sub").textContent = q.left
        ? "Optional. Up to " + q.left + ". These go live on the homepage right away."
        : "You've used all your uploads. You can add images later as you earn points.";
      document.getElementById("first-drop").classList.toggle("locked", !q.left);
      document.getElementById("first-file").disabled = !q.left;
    });
    form.name.focus();
  }
  function closeCreate() {
    form.hidden = true; form.reset(); avaFile = null; firstFiles = [];
    document.getElementById("ava-img").innerHTML = "<span>+ Photo</span>";
    document.getElementById("first-thumbs").innerHTML = "";
    document.getElementById("newchar-err").textContent = "";
    if (mine.length) showMain(true);
  }
  function thumb(f) { return URL.createObjectURL(f); }
  document.getElementById("ava-file").onchange = function (e) {
    var f = e.target.files[0]; if (!f) return; avaFile = f;
    document.getElementById("ava-img").innerHTML = '<img src="' + thumb(f) + '" alt="">';
  };
  function addFirst(list) {
    Array.prototype.slice.call(list).filter(function (f) { return /^image\//.test(f.type); }).forEach(function (f) {
      if (firstFiles.length < firstLeft) firstFiles.push(f);
    });
    document.getElementById("first-thumbs").innerHTML = firstFiles.map(function (f, i) {
      return '<span class="newchar-thumb"><img src="' + thumb(f) + '" alt=""><button type="button" data-rm="' + i + '" aria-label="Remove">×</button></span>';
    }).join("");
    document.querySelectorAll("[data-rm]").forEach(function (b) {
      b.onclick = function () { firstFiles.splice(+b.dataset.rm, 1); addFirst([]); };
    });
  }
  document.getElementById("first-file").onchange = function (e) { addFirst(e.target.files); e.target.value = ""; };
  var fdrop = document.getElementById("first-drop");
  ["dragenter", "dragover"].forEach(function (ev) { fdrop.addEventListener(ev, function (e) { e.preventDefault(); fdrop.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (ev) { fdrop.addEventListener(ev, function (e) { e.preventDefault(); fdrop.classList.remove("over"); }); });
  fdrop.addEventListener("drop", function (e) { if (!document.getElementById("first-file").disabled) addFirst(e.dataTransfer.files); });
  document.getElementById("newchar-cancel").onclick = function () { closeCreate(); renderTabs(); };
  form.onsubmit = function (e) {
    e.preventDefault();
    var err = document.getElementById("newchar-err"), btn = document.getElementById("newchar-go");
    err.textContent = ""; btn.disabled = true; btn.textContent = "Creating…";
    var files = firstFiles.slice();
    Studio.createCharacter({ name: form.name.value, handle: form.handle.value, bio: form.bio.value, avatar: avaFile }, user)
      .then(function (c) {
        mine.unshift(c.slug); current = c.slug;
        return (files.length ? Studio.upload(c, files, true) : Promise.resolve()).then(function () { closeCreate(); renderTabs(); load(); });
      })
      .catch(function (x) { err.textContent = (x && x.message) || "Something went wrong. Please try again."; })
      .then(function () { btn.disabled = false; btn.textContent = "Create character"; });
  };

  var drop = document.getElementById("drop");
  document.getElementById("file").onchange = function (e) { handle(e.target.files); e.target.value = ""; };
  ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function (e) { if (!document.getElementById("file").disabled) handle(e.dataTransfer.files); });
</script>
</body>
</html>
