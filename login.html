<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Persona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="nav"></header>

<main class="login">
  <div class="eyebrow">Creator Studio</div>
  <h1>Sign in</h1>
  <p style="color:var(--muted);margin-bottom:28px">Sign in to keep your saves and follows on every device. Creators also upload images and choose what goes live.</p>
  <button class="btn" id="google" style="width:100%;justify-content:center"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg> Continue with Google</button>
  <p class="legal-note">By continuing you agree to our <a href="terms.html">Terms</a> and <a href="content-policy.html">Content Policy</a>. When you sign in, your saves and follows are kept in your account.</p>
  <p class="err" id="err"></p>
  <p class="note" id="mode"></p>
</main>
<script src="vendor/supabase-js-2.119.0.js"></script>
<script src="config.js"></script>
<script src="api/config"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script src="search.js"></script>
<script>
  Studio.session().then(function (s) { if (s) location.href = "studio.html"; });
  if (Studio.mode === "error") document.getElementById("err").textContent = "Sign-in couldn't load. Please refresh the page and try again.";
  if (Studio.mode === "demo") document.getElementById("mode").textContent = "Demo mode: Google sign-in switches on once Supabase is connected. For now this signs you in as " + CREATOR.name + ".";
  document.getElementById("google").onclick = function () {
    this.disabled = true;
    Studio.signInWithGoogle().catch(function (e) { document.getElementById("err").textContent = e.message; document.getElementById("google").disabled = false; });
  };
</script>
</body>
</html>
